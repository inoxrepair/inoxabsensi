<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <title>iNox Absensi - Offline</title>
    <style>
      body{margin:0;background:#f3f4f6;color:#111;font:16px system-ui,sans-serif}
      main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
      section{max-width:360px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;text-align:center}
      h1{font-size:20px;margin:0 0 8px}p{color:#6b7280;line-height:1.5;margin:0 0 16px}
      button{border:0;border-radius:12px;background:#111;color:#fff;padding:12px 18px;font-weight:600}
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Tidak ada koneksi</h1>
        <p>Absensi memerlukan internet agar waktu, lokasi, dan data tersimpan aman di server.</p>
        <button onclick="location.reload()">Coba lagi</button>
      </section>
    </main>
  </body>
</html>
